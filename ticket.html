<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER TOÑITA - Ticket Digital</title>
  <link rel="icon" type="image/png" href="LOGO.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-primary: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --emerald-accent: #059669;
      --emerald-dark: #047857;
      --brand-dark: #1e293b;
      --amber-accent: #d97706;
      --border: #e2e8f0;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-card: 0 8px 24px -4px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 1.5rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .ticket-card {
      background: var(--surface);
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      text-align: center;
      color: var(--brand-dark);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }
    .brand-title span { color: var(--emerald-accent); }
    
    .ticket-sub {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.75rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      margin-bottom: 0.5rem;
    }

    .total-box {
      background: var(--bg-primary);
      padding: 1rem;
      border-radius: var(--radius-md);
      margin: 1rem 0;
      text-align: right;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--emerald-accent);
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--brand-dark);
      color: white;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      margin-top: 0.75rem;
    }
    .btn-emerald { background: var(--emerald-accent); }
    .btn-emerald:hover { background: var(--emerald-dark); }
  </style>
</head>
<body>

  <div class="ticket-card">
    <div class="brand-title">SUPER <span>TOÑITA</span></div>
    <div class="ticket-sub">Sucursal Los Fuentes • Recibo Digital</div>

    <div class="info-row">
      <span style="color: var(--text-muted);">Folio de Compra:</span>
      <strong id="lblFolio">---</strong>
    </div>
    <div class="info-row">
      <span style="color: var(--text-muted);">Fecha y Hora:</span>
      <strong id="lblFecha">---</strong>
    </div>

    <div style="border-top: 1px dashed var(--border); margin: 1rem 0; padding-top: 0.75rem;">
      <div style="font-size: 0.85rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--brand-dark);">RESUMEN DE PAGO</div>
      <div class="total-box">
        Total Pagado: $<span id="lblTotal">0.00</span>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.25rem; background: #fef3c7; padding: 1rem; border-radius: var(--radius-md); border: 1px solid #fde68a;">
      <i class="fa-solid fa-star" style="color: var(--amber-accent); font-size: 1.2rem; margin-bottom: 0.3rem;"></i>
      <h4 style="font-size: 0.9rem; color: var(--amber-accent); font-weight: 900;">¡Acumulaste Puntos!</h4>
      <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem;">Tus puntos de esta compra ya están listos o se acreditaron en tu cuenta de la app.</p>
    </div>

    <a href="index.html" class="btn btn-emerald">
      <i class="fa-solid fa-store"></i> Ir a la Tienda Online y Canjes
    </a>
  </div>

  <script>
    // Capturamos los parámetros que vienen en la URL del mensaje de WhatsApp
    const params = new URLSearchParams(window.location.search);
    const folio = params.get('folio') || 'TK-000000';
    const total = params.get('total') || '0.00';

    document.getElementById('lblFolio').innerText = folio;
    document.getElementById('lblTotal').innerText = parseFloat(total).toFixed(2);
    document.getElementById('lblFecha').innerText = new Date().toLocaleString('es-SV');
  </script>

</body>
</html>
